workflows:
  lara-stable:
    name: Lara4 Stable IPA
    max_build_duration: 60
    instance_type: mac_mini_m2

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true

    environment:
      xcode: 15.2
      vars:
        PROJECT_DIR: Lara3-fixed

    scripts:
      - name: Install dependencies
        script: |
          brew install ldid
          xcode-select -p
          xcodebuild -version

      - name: Build IPA
        script: |
          cd $PROJECT_DIR
          chmod +x ipabuild.sh
          ./ipabuild.sh

      - name: Verify IPA
        script: |
          cd $PROJECT_DIR
          echo "[*] IPA size:"
          ls -lh build/lara.ipa
          echo "[*] Entitlements:"
          unzip -p build/lara.ipa Payload/lara.app/lara > /tmp/lara_bin
          ldid -e /tmp/lara_bin || true

    artifacts:
      - Lara3-fixed/build/lara.ipa
      - Lara3-fixed/build/xcodebuild.log

    publishing:
      github_releases:
        prerelease: true
        release_notes: Lara4 Stable Release - Multi-Path Root Engine v6.0
