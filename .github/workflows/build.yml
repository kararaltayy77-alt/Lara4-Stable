name: Build Lara4 IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install ldid
        run: brew install ldid

      - name: Build IPA
        working-directory: Lara3-fixed
        run: |
          chmod +x ipabuild.sh
          ./ipabuild.sh

      - name: Upload IPA
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Lara4-Stable-IPA
          path: Lara3-fixed/build/lara.ipa

      - name: Create Release
        if: success() && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create stable-v1 Lara3-fixed/build/lara.ipa \
            --title "Lara4 Stable v1" \
            --notes "Lara4 Stable Release" \
            --prerelease \
            || gh release upload stable-v1 Lara3-fixed/build/lara.ipa --clobber
