name: Build Lara4 IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-13
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select Xcode 15.2
        run: |
          sudo xcode-select -s /Applications/Xcode_15.2.app/Contents/Developer
          xcodebuild -version

      - name: Install ldid
        run: brew install ldid

      - name: Build IPA
        working-directory: Lara3-fixed
        run: |
          chmod +x ipabuild.sh
          ./ipabuild.sh

      - name: Upload IPA
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Lara4-Stable-IPA
          path: Lara3-fixed/build/lara.ipa

      - name: Create Release
        if: success() && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create stable-v1 Lara3-fixed/build/lara.ipa             --title "Lara4 Stable v1"             --notes "Lara4 Stable Release - Multi-Path Root Engine v6.0"             --prerelease             || gh release upload stable-v1 Lara3-fixed/build/lara.ipa --clobber
